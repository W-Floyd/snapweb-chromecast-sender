<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chromecast Sender</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen" x-data="app()" x-init="init()" x-cloak>

  <!-- Notification toast -->
  <!-- Hidden by clearing `show`, not by dropping the whole object: nulling it
       emptied msg and reset type at the instant the fade-out began, so an error
       toast spent its exit transition blank and green. -->
  <div x-show="notification?.show" x-transition
       :class="notification?.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'"
       class="fixed top-4 right-4 z-50 max-w-sm px-4 py-2.5 rounded-lg shadow-xl text-white font-medium text-sm break-words"
       x-text="notification?.msg">
  </div>

  <div class="max-w-5xl mx-auto px-4 py-8">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Chromecast Sender</h1>
        <p class="text-slate-400 text-sm mt-0.5">
          <span x-show="lastRefresh">Updated <span x-text="lastRefresh"></span></span>
          <span x-show="!lastRefresh">Loading...</span>
        </p>
      </div>
      <button @click="refreshStatuses()" :disabled="loadingStatus"
              class="flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 rounded-lg text-sm font-medium transition-colors">
        <svg :class="loadingStatus && 'animate-spin'" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Refresh
      </button>
    </div>

    <!-- Devices Section -->
    <section class="mb-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-slate-200 uppercase tracking-wider text-xs">Devices</h2>
        <div class="flex gap-2" x-show="config.devices.length > 0">
          <button @click="castAll()"
                  class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-medium transition-colors">
            Cast All
          </button>
          <button @click="stopAll()"
                  class="px-3 py-1.5 bg-slate-600 hover:bg-slate-500 rounded-lg text-xs font-medium transition-colors">
            Stop All
          </button>
        </div>
      </div>

      <div x-show="config.devices.length === 0"
           class="text-slate-500 text-sm py-10 text-center border border-dashed border-slate-700 rounded-xl">
        No devices configured yet — use the scanner below to find devices.
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <template x-for="(device, i) in config.devices" :key="i">
          <div class="bg-slate-800 rounded-xl p-5 border border-slate-700">
            <div class="flex items-start justify-between mb-4">
              <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full flex-shrink-0"
                     :class="(s => ({
                       'bg-emerald-400': s && s !== 'buffering' && !['idle','unknown',''].includes(s),
                       'bg-yellow-400 animate-pulse': s === 'buffering',
                       'bg-slate-500': !s || ['idle','unknown',''].includes(s),
                     }))(statusFor(device, i)?.state?.toLowerCase())">
                </div>
                <div>
                  <!-- Fall back to the IP: a device added from a scan and then
                       renamed to nothing, or a host-only entry, otherwise
                       rendered a card with no title at all. -->
                  <p class="font-medium text-white text-sm leading-tight" x-text="deviceLabel(device)"></p>
                  <p class="text-slate-400 text-xs mt-0.5 capitalize"
                     x-text="statusFor(device, i)?.state || 'unknown'">
                  </p>
                  <!-- The state line above already names the app; this says whose
                       it is, which is the part that decides whether auto-cast
                       will leave the device alone. -->
                  <p x-show="statusFor(device, i)?.foreign"
                     class="text-amber-400 text-xs mt-0.5"
                     x-text="device.takeover ? 'In use by another app — will take over' : 'In use by another app — leaving it alone'">
                  </p>
                  <!-- Advisory, not a failure: amber like the line above rather
                       than red, so a real cast error stays the thing that
                       stands out on the card. -->
                  <p x-show="statusFor(device, i)?.warning"
                     class="text-amber-400 text-xs mt-0.5"
                     x-text="statusFor(device, i)?.warning">
                  </p>
                  <p x-show="statusFor(device, i)?.error"
                     class="text-red-400 text-xs mt-1 break-all line-clamp-3"
                     :title="statusFor(device, i)?.error"
                     x-text="statusFor(device, i)?.error">
                  </p>
                </div>
              </div>
              <div class="flex flex-col items-end gap-1 flex-shrink-0">
                <label class="flex items-center gap-1.5 text-xs text-slate-400 cursor-pointer select-none">
                  <input type="checkbox" x-model="device.auto_cast" class="accent-blue-500" />
                  Auto-cast
                </label>
                <!-- Only meaningful with auto-cast on; dimmed rather than hidden
                     so the setting does not appear and vanish as the box is
                     toggled. -->
                <label class="flex items-center gap-1.5 text-xs cursor-pointer select-none transition-opacity"
                       :class="device.auto_cast ? 'text-slate-400' : 'text-slate-600'"
                       title="Re-cast even when someone else is using the device">
                  <input type="checkbox" x-model="device.takeover" :disabled="!device.auto_cast" class="accent-amber-500" />
                  Take over
                </label>
              </div>
            </div>

            <input type="text" x-model="device.host"
                   placeholder="IP address (e.g. 192.168.1.5)"
                   class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 mb-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 transition" />
            <input type="url" x-model="device.url"
                   :placeholder="config.default_url || 'https://... (or uses default URL)'"
                   class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 mb-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 transition" />

            <div class="flex gap-2">
              <button @click="castDevice(device)"
                      class="flex-1 px-3 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-medium transition-colors">
                Cast
              </button>
              <button @click="stopDevice(device)"
                      class="flex-1 px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition-colors">
                Stop
              </button>
            </div>
          </div>
        </template>
      </div>
    </section>

    <!-- Config Section -->
    <section class="mb-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-slate-200 uppercase tracking-wider text-xs">Configuration</h2>
        <button @click="saveConfig()" :disabled="saving"
                class="px-4 py-1.5 bg-emerald-700 hover:bg-emerald-600 disabled:opacity-50 rounded-lg text-sm font-medium transition-colors">
          <span x-show="!saving">Save</span>
          <span x-show="saving">Saving...</span>
        </button>
      </div>

      <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 space-y-5">
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1.5 font-medium">Default URL</label>
            <input type="url" x-model="config.default_url"
                   placeholder="http://192.168.1.x/dashboard"
                   class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 transition" />
            <p class="text-xs text-slate-500 mt-1">Used when a device has no URL set</p>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1.5 font-medium">Check Interval (seconds)</label>
            <!-- max matches the server's clamp: past ~9.2e9 seconds the
                 monitor's sleep duration overflows and it stops sleeping. -->
            <input type="number" x-model.number="config.check_interval" min="10" max="86400"
                   class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 transition" />
            <p class="text-xs text-slate-500 mt-1">How often to check idle devices</p>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs text-slate-400 font-medium">Device Names</label>
            <button @click="addDeviceManually()"
                    class="text-xs text-blue-400 hover:text-blue-300 transition-colors">+ Add manually</button>
          </div>
          <template x-for="(device, i) in config.devices" :key="i">
            <div class="flex items-center gap-2 mb-2">
              <input type="text" x-model="device.name" placeholder="Device name (must match exactly)"
                     class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition" />
              <button @click="config.devices.splice(i, 1)"
                      class="text-slate-500 hover:text-red-400 transition-colors px-2 text-xl leading-none">×</button>
            </div>
          </template>
          <div x-show="config.devices.length === 0" class="text-slate-500 text-xs">No devices added yet.</div>
        </div>
      </div>
    </section>

    <!-- Scanner Section -->
    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold text-slate-200 uppercase tracking-wider text-xs">Network Scanner</h2>
        <button @click="scan()" :disabled="scanning"
                class="flex items-center gap-2 px-4 py-1.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 rounded-lg text-sm font-medium transition-colors">
          <svg :class="scanning && 'animate-spin'" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
          </svg>
          <span x-show="!scanning">Scan Network</span>
          <span x-show="scanning">Scanning...</span>
        </button>
      </div>

      <div class="flex items-center gap-3 mb-4">
        <label for="subnet-input" class="text-xs text-slate-400 whitespace-nowrap">Subnet</label>
        <input id="subnet-input"
               type="text"
               list="subnet-list"
               x-model="scanSubnet"
               :disabled="scanning"
               placeholder="Auto-detect (or e.g. 192.168.1.0/24)"
               class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 disabled:opacity-50 transition" />
        <datalist id="subnet-list">
          <template x-for="s in suggestedSubnets" :key="s">
            <option :value="s"></option>
          </template>
        </datalist>
        <button x-show="scanSubnet" @click="scanSubnet = ''"
                class="text-slate-500 hover:text-slate-300 text-lg leading-none transition-colors">×</button>
      </div>

      <!-- Live diagnostics -->
      <div x-show="scanStatus" class="mb-4 bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3">
        <p class="text-slate-300 text-sm font-mono" x-text="scanStatus"></p>
        <template x-if="scanProgress && scanProgress.total > 0">
          <div>
            <div class="flex justify-between text-xs text-slate-500 mb-1.5">
              <span x-text="scanProgress.checked + ' / ' + scanProgress.total + ' hosts checked'"></span>
              <span x-text="scanPercent() + '%'"></span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-1.5">
              <div class="bg-blue-500 h-1.5 rounded-full transition-all duration-300"
                   :style="'width:' + scanPercent() + '%'"></div>
            </div>
          </div>
        </template>
      </div>

      <div x-show="!scanStatus && !scanning && discoveredDevices.length === 0"
           class="text-slate-500 text-sm py-10 text-center border border-dashed border-slate-700 rounded-xl">
        Click "Scan Network" to discover Chromecast devices.
      </div>

      <div class="grid gap-3 sm:grid-cols-2">
        <!-- Keyed by host, not name: two Chromecasts can share a friendly name,
             and a duplicate x-for key makes Alpine throw and drop the list. -->
        <template x-for="device in discoveredDevices" :key="device.host">
          <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 flex items-center justify-between">
            <div>
              <p class="font-medium text-white text-sm" x-text="device.name"></p>
              <p class="text-slate-400 text-xs mt-0.5" x-text="device.host"></p>
            </div>
            <button @click="addFromScan(device)"
                    :disabled="scanAddState(device) === 'added'"
                    class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-400 rounded-lg text-xs font-medium transition-colors">
              <span x-show="scanAddState(device) === 'add'">Add to Config</span>
              <span x-show="scanAddState(device) === 'set-ip'">Set IP</span>
              <span x-show="scanAddState(device) === 'added'">Added</span>
            </button>
          </div>
        </template>
      </div>
    </section>

  </div>

  <script>
    function app() {
      return {
        config: { check_interval: 60, default_url: '', devices: [] },
        statuses: [],
        discoveredDevices: [],
        loadingStatus: false,
        scanning: false,
        saving: false,
        notification: null,
        _notifyTimer: null,
        lastRefresh: '',
        scanStatus: '',
        scanProgress: null,
        scanSubnet: '',
        suggestedSubnets: [],

        async init() {
          await this.loadConfig()
          // Started before the status refresh, not after it: /api/devices/status
          // shells out per device and can take 15s, and awaiting it left the
          // scanner's subnet suggestions empty for that whole time even though
          // /api/subnets answers instantly. Not awaited — nothing below needs it.
          this.loadSubnets()
          await this.refreshStatuses()
          setInterval(() => this.refreshStatuses(), 30000)
        },

        async loadSubnets() {
          try {
            const res = await fetch('/api/subnets')
            if (res.ok) this.suggestedSubnets = await res.json() || []
          } catch {}
        },

        async loadConfig() {
          try {
            const res = await fetch('/api/config')
            if (res.ok) {
              this.config = await res.json()
              if (!this.config.devices) this.config.devices = []
            }
          } catch (e) {
            this.notify('Failed to load config: ' + e.message, 'error')
          }
        },

        async saveConfig() {
          this.saving = true
          try {
            // Clearing the number input leaves x-model.number holding '', which
            // the Go decoder rejects with an opaque 400. Coerce it here, and let
            // the server's response tell us what it actually stored (it clamps
            // the interval to a floor).
            const payload = {
              ...this.config,
              check_interval: Number(this.config.check_interval) || 60,
            }
            const res = await fetch('/api/config', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            })
            if (!res.ok) throw new Error(await res.text())
            await this.loadConfig()
            // Status carries server-derived advisories about the config we just
            // saved (a device left without an IP), so re-poll instead of leaving
            // them to appear up to a full refresh interval later.
            this.refreshStatuses()
            this.notify('Config saved', 'success')
          } catch (e) {
            this.notify('Save failed: ' + e.message, 'error')
          } finally {
            this.saving = false
          }
        },

        async refreshStatuses() {
          if (this.loadingStatus) return
          this.loadingStatus = true
          try {
            const res = await fetch('/api/devices/status')
            if (res.ok) {
              this.statuses = await res.json() || []
              this.lastRefresh = new Date().toLocaleTimeString()
            }
          } catch {
            // silent — network may be briefly unavailable
          } finally {
            this.loadingStatus = false
          }
        },

        // Match by position, not name: /api/devices/status returns one entry per
        // configured device in config order, and friendly names are neither
        // unique nor always set — a name lookup gave two same-named devices (or
        // every not-yet-named row) the first match's state. The name check keeps
        // us honest when the local list has unsaved adds/removes and the indexes
        // no longer line up: better "unknown" than another device's status.
        statusFor(device, i) {
          const s = this.statuses[i]
          return s && s.name === device.name ? s : undefined
        },

        scanPercent() {
          if (!this.scanProgress || !this.scanProgress.total) return 0
          return Math.round(this.scanProgress.checked / this.scanProgress.total * 100)
        },

        scan() {
          if (this.scanning) return
          this.scanning = true
          this.discoveredDevices = []
          this.scanStatus = 'Starting...'
          this.scanProgress = null

          const url = this.scanSubnet
            ? `/api/devices/scan?subnet=${encodeURIComponent(this.scanSubnet)}`
            : '/api/devices/scan'
          const es = new EventSource(url)

          es.onmessage = (e) => {
            let evt
            try {
              evt = JSON.parse(e.data)
            } catch {
              return // ignore a malformed frame rather than wedging scanning=true
            }
            switch (evt.type) {
              case 'status':
                this.scanStatus = evt.message
                break
              case 'progress':
                this.scanProgress = { checked: evt.checked, total: evt.total }
                break
              case 'found':
                // The list below is keyed by host, and Alpine throws on a
                // missing or duplicate key — taking the whole rendered list
                // down, not just the one bad row.
                if (evt.device?.host && !this.discoveredDevices.some(d => d.host === evt.device.host)) {
                  this.discoveredDevices.push(evt.device)
                }
                break
              case 'done':
                this.scanning = false
                // Keep the last progress event rather than clearing it. The
                // server emits a final one once every host has been checked,
                // specifically so the bar is not left short of 100% — and
                // nulling it here threw that away, so the bar vanished at
                // whatever the 500ms ticker last happened to report.
                es.close()
                // A message on the done event is the server explaining why it
                // stopped (bad subnet, scan already running). Prefer it — the
                // generic "no devices" text would bury the actual reason.
                if (evt.message) {
                  this.scanStatus = evt.message
                  this.notify(evt.message, 'error')
                } else if (evt.count === 0) {
                  this.scanStatus = 'No devices found'
                  this.notify('No Chromecast devices found', 'error')
                } else {
                  this.scanStatus = `Done — found ${evt.count} device${evt.count !== 1 ? 's' : ''}`
                }
                break
            }
          }

          es.onerror = () => {
            es.close()
            // The server closes the stream right after its "done" event, and the
            // browser can surface that close as an error even though the scan
            // finished — reporting "Scan failed" over a completed result.
            if (!this.scanning) return
            this.scanning = false
            this.scanProgress = null
            this.scanStatus = 'Scan failed'
            this.notify('Scan failed', 'error')
          }
        },

        // Match on the IP first, falling back to the name only for a config
        // entry that has no IP yet. Two Chromecasts can share a friendly name,
        // and matching on name alone made the second one resolve to the first:
        // its button read "Added" and clicking it did nothing, so the device
        // could not be added at all.
        matchConfigured(discovered) {
          return this.config.devices.find(d => d.host && d.host === discovered.host)
            || this.config.devices.find(d => !d.host && d.name === discovered.name)
        },

        scanAddState(discovered) {
          const existing = this.matchConfigured(discovered)
          if (!existing) return 'add'
          return existing.host ? 'added' : 'set-ip'
        },

        addFromScan(discovered) {
          const existing = this.matchConfigured(discovered)
          if (existing) {
            // Already configured but with no IP (e.g. added manually) — fill it
            // in rather than silently doing nothing.
            if (!existing.host) {
              existing.host = discovered.host
              this.notify(`Set IP for "${discovered.name}" — save config to persist`, 'success')
            }
            return
          }
          this.config.devices.push({ name: discovered.name, host: discovered.host, url: '', auto_cast: false, takeover: false })
          this.notify(`Added "${discovered.name}" — save config to persist`, 'success')
        },

        addDeviceManually() {
          this.config.devices.push({ name: '', host: '', url: '', auto_cast: false, takeover: false })
        },

        // How to name a device in the UI. A device only needs *one* of name and
        // host to be castable, so the name alone left host-only devices with a
        // blank card title and toasts reading `Casting to ""`.
        deviceLabel(device) {
          return device.name || device.host || 'unnamed device'
        },

        // notifyResult: skip per-device toasts during Cast All / Stop All so the
        // caller can report one summary instead. Both return { ok, error } rather
        // than a boolean — the reason has to survive back to the caller, because
        // during a batch there is only one toast and it is the summary.
        async castDevice(device, notifyResult = true) {
          const url = device.url || this.config.default_url
          if (!url) {
            const error = `no URL set for "${this.deviceLabel(device)}" (and no default URL)`
            if (notifyResult) this.notify(error, 'error')
            return { ok: false, error }
          }
          try {
            const res = await fetch('/api/devices/cast', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: device.name, host: device.host || '', url }),
            })
            if (!res.ok) throw new Error(await res.text())
            if (notifyResult) this.notify(`Casting to "${this.deviceLabel(device)}"`, 'success')
            setTimeout(() => this.refreshStatuses(), 5000)
            return { ok: true }
          } catch (e) {
            if (notifyResult) this.notify('Cast error: ' + e.message, 'error')
            return { ok: false, error: e.message }
          }
        },

        async stopDevice(device, notifyResult = true) {
          try {
            const res = await fetch('/api/devices/stop', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: device.name, host: device.host || '' }),
            })
            if (!res.ok) throw new Error(await res.text())
            if (notifyResult) this.notify(`Stopped "${this.deviceLabel(device)}"`, 'success')
            setTimeout(() => this.refreshStatuses(), 3000)
            return { ok: true }
          } catch (e) {
            if (notifyResult) this.notify('Stop error: ' + e.message, 'error')
            return { ok: false, error: e.message }
          }
        },

        // Carry the first failure's reason into the summary. Without it a batch
        // that failed read "Casting to 0 of 3 devices" and nothing else: the
        // per-device toasts are suppressed, and each would have overwritten the
        // last in any case, so the explanation was lost entirely.
        //
        // Any failure makes the whole toast red. Colouring on "at least one
        // worked" put a green toast on "Casting to 1 of 3 devices — no URL set
        // for Kitchen", so the only thing that had actually gone wrong was
        // styled as success.
        batchSummary(verb, results) {
          const n = results.filter(r => r.ok).length
          const failed = results.find(r => !r.ok)
          const msg = `${verb} ${n} of ${results.length} device${results.length !== 1 ? 's' : ''}`
          return { msg: failed ? `${msg} — ${failed.error}` : msg, ok: !failed }
        },

        async castAll() {
          const results = await Promise.all(
            this.config.devices.map(d => this.castDevice(d, false)))
          const { msg, ok } = this.batchSummary('Casting to', results)
          this.notify(msg, ok ? 'success' : 'error')
        },

        async stopAll() {
          const results = await Promise.all(
            this.config.devices.map(d => this.stopDevice(d, false)))
          const { msg, ok } = this.batchSummary('Stopped', results)
          this.notify(msg, ok ? 'success' : 'error')
        },

        notify(msg, type = 'success') {
          this.notification = { msg, type, show: true }
          // Reset the timer on each notification — otherwise an earlier toast's
          // pending timeout clears a newer one after only a fraction of its life
          // (very visible during Cast All / Stop All).
          clearTimeout(this._notifyTimer)
          this._notifyTimer = setTimeout(() => {
            if (this.notification) this.notification.show = false
          }, 3500)
        },
      }
    }
  </script>
</body>
</html>
