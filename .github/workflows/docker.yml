name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Run the test job on pull requests too. Gating only pushes to main meant the
  # checks below first ran on the commit that had already landed, which is the
  # one moment they cannot stop anything; the build job is skipped here because
  # there is nothing to publish for a branch.
  pull_request:
    branches: [main]

jobs:
  # The image build compiles the binary, so a syntax error already fails the
  # push — but nothing ran vet or the race-detector tests, and most of what this
  # repo can get wrong (concurrent cast-state access, the parsing helpers) is
  # only visible there. Gate the push on them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      # The status helper is half of the subprocess contract, and its tests need
      # neither pychromecast nor a device — see scripts/test_cc_status.py.
      - name: status helper tests
        run: python3 -m unittest discover -s scripts

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
